name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: yarn install --immutable
        env:
          HUSKY: "0"
      - run: yarn lint
      - run: yarn tsc --noEmit
      - run: yarn build
      - run: yarn smoke
